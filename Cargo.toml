[package]
name = "tree-sitter-xo"
description = "Xo grammar for tree-sitter"
version = "0.1.0"
authors = ["Joseph Spurrier"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "xo"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/xo-lang/tree-sitter-xo"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["/bindings/rust/*", "/grammar.js", "/queries/*", "/src/*.c", "/src/*.json", "/src/tree_sitter/*.h", "/tree-sitter.json", "/LICENSE", "/README.md"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1.22"

[dev-dependencies]
tree-sitter = "0.24.7"
